server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Distinct probe paths (different timing/semantics in Helm; not one shared /healthz)
  location = /livez {
    access_log off;
    default_type text/plain;
    return 200 'alive';
  }

  location = /readyz {
    access_log off;
    default_type text/plain;
    # Fail readiness if the SPA bundle is missing
    try_files /index.html =503;
  }

  location = /startupz {
    access_log off;
    default_type text/plain;
    try_files /index.html =503;
  }

  location / {
    try_files $uri /index.html;
  }
}
