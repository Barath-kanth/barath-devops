apiVersion: v2
name: bookshelf
description: Bookshelf umbrella chart (catalog-api, loans-api, frontend)
type: application
version: 0.1.0
appVersion: "1.0.0"
# -0 allows EKS versions like v1.34.9-eks-… (treated as prerelease by Helm)
kubeVersion: ">=1.28.0-0"
dependencies:
  - name: catalog-api
    version: 0.1.0
    repository: "file://sub-charts/catalog-api"
  - name: loans-api
    version: 0.1.0
    repository: "file://sub-charts/loans-api"
  - name: frontend
    version: 0.1.0
    repository: "file://sub-charts/frontend"
