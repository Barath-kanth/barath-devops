{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bookshelf
  labels:
    app.kubernetes.io/name: bookshelf
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: bookshelf
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      sectionName: http
  hostnames:
    - {{ .Values.gateway.hostname | quote }}
  rules:
    # More specific paths first
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.gateway.routes.catalog.path }}
      backendRefs:
        - name: {{ .Values.gateway.routes.catalog.service }}
          port: {{ .Values.gateway.routes.catalog.port }}

    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.gateway.routes.loans.path }}
      backendRefs:
        - name: {{ .Values.gateway.routes.loans.service }}
          port: {{ .Values.gateway.routes.loans.port }}

    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.gateway.routes.frontend.path }}
      backendRefs:
        - name: {{ .Values.gateway.routes.frontend.service }}
          port: {{ .Values.gateway.routes.frontend.port }}
{{- end }}
