# Istio mesh resilience + observability add-ons for Bookshelf
# Applied into bookshelf + istio-system
---
# STRICT mTLS already via Helm PeerAuthentication when mesh.enabled=true.
# DestinationRules: circuit breaking, connection pools, outlier detection
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: catalog-api
  namespace: bookshelf
spec:
  host: catalog-api
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 50
        http2MaxRequests: 100
        maxRequestsPerConnection: 2
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
    tls:
      mode: ISTIO_MUTUAL
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: loans-api
  namespace: bookshelf
spec:
  host: loans-api
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 50
        http2MaxRequests: 100
        maxRequestsPerConnection: 2
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
    tls:
      mode: ISTIO_MUTUAL
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: frontend
  namespace: bookshelf
spec:
  host: frontend
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    connectionPool:
      http:
        http1MaxPendingRequests: 100
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
---
# Retries / timeouts (advanced traffic management)
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: bookshelf-mesh
  namespace: bookshelf
spec:
  hosts:
    - catalog-api
    - loans-api
    - frontend
  http:
    - name: catalog
      match:
        - authority:
            prefix: catalog-api
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: 5xx,reset,connect-failure,refused-stream
      timeout: 10s
      route:
        - destination:
            host: catalog-api
            port:
              number: 3001
    - name: loans
      match:
        - authority:
            prefix: loans-api
      retries:
        attempts: 3
        perTryTimeout: 3s
        retryOn: 5xx,reset,connect-failure,refused-stream
      timeout: 15s
      route:
        - destination:
            host: loans-api
            port:
              number: 3002
    - name: frontend
      match:
        - authority:
            prefix: frontend
      timeout: 10s
      route:
        - destination:
            host: frontend
            port:
              number: 80
---
# Mesh-wide telemetry → Prometheus (golden signals without app code)
apiVersion: telemetry.istio.io/v1
kind: Telemetry
metadata:
  name: mesh-default
  namespace: istio-system
spec:
  accessLogging:
    - providers:
        - name: envoy
  metrics:
    - providers:
        - name: prometheus
---
apiVersion: telemetry.istio.io/v1
kind: Telemetry
metadata:
  name: bookshelf
  namespace: bookshelf
spec:
  tracing:
    - randomSamplingPercentage: 100
  metrics:
    - providers:
        - name: prometheus
  accessLogging:
    - providers:
        - name: envoy
