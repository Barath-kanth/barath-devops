# OpenTelemetry Collector (Gateway) — receives OTLP, exports to Prometheus + logging
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: bookshelf
  namespace: observability
spec:
  mode: deployment
  image: otel/opentelemetry-collector-contrib:0.117.0
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch: {}
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15
    exporters:
      # Scrapeable metrics endpoint for Prometheus Operator
      prometheus:
        endpoint: 0.0.0.0:8889
      debug:
        verbosity: basic
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [prometheus, debug]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug]
---
# Auto-instrument Node.js workloads annotated with:
#   instrumentation.opentelemetry.io/inject-nodejs: "observability/bookshelf-nodejs"
apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: bookshelf-nodejs
  namespace: observability
spec:
  exporter:
    endpoint: http://bookshelf-collector.observability.svc.cluster.local:4317
  propagators:
    - tracecontext
    - baggage
  sampler:
    type: parentbased_traceidratio
    argument: "1.0"
  nodejs:
    image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-nodejs:0.57.0
    env:
      - name: OTEL_SERVICE_NAMESPACE
        value: bookshelf
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: otel-collector
  namespace: observability
  labels:
    release: kps
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: bookshelf-collector
  namespaceSelector:
    matchNames:
      - observability
  endpoints:
    - port: prometheus
      interval: 30s
      path: /metrics
