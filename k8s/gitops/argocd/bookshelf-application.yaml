# Argo CD Application — Bookshelf Helm umbrella (GitOps)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bookshelf
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Barath-kanth/barath-devops.git
    targetRevision: main
    path: k8s/helm/chart/bookshelf
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: bookshelf
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    # Gateway API controller mutates status/defaults; ignore so sync stays clean
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      jqPathExpressions:
        - .status
        - .metadata.generation
        - .metadata.resourceVersion
        - .metadata.managedFields
      jsonPointers:
        - /status
        - /spec/parentRefs
        - /spec/rules
    - group: gateway.networking.k8s.io
      kind: Gateway
      jsonPointers:
        - /status
        - /metadata/annotations
