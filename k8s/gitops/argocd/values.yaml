# Argo CD — lean HA-off install for GitOps CD
# Chart: argo/argo-cd

crds:
  install: true

global:
  logging:
    level: info

configs:
  params:
    server.insecure: true
  cm:
    # Allow Helm from this org / public charts when using ApplicationSets later
    timeout.reconciliation: 60s
    application.resourceTrackingMethod: annotation

controller:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

server:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 256Mi
  service:
    type: ClusterIP

repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 256Mi

applicationSet:
  enabled: true
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

notifications:
  enabled: false

dex:
  enabled: false

redis:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
