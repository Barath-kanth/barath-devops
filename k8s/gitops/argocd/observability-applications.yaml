# Observability Applications — charts vendored in-repo (no remote helm pull)
# Requires Argo CD ≥ 2.6
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/Barath-kanth/barath-devops.git
      targetRevision: main
      path: k8s/gitops/observability/prometheus/chart
      helm:
        releaseName: kps
        valueFiles:
          - $values/k8s/gitops/observability/prometheus/values.yaml
    - repoURL: https://github.com/Barath-kanth/barath-devops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
