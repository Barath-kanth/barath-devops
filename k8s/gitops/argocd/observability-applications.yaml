---
# Collector + Instrumentation CRs (plain YAML)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-instrumentation
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Barath-kanth/barath-devops.git
    targetRevision: main
    path: k8s/gitops/observability/otel
    directory:
      include: "collector-instrumentation.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 3m
---
# Mesh policies + Prometheus scrape for Istio/Envoy
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mesh-observability
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Barath-kanth/barath-devops.git
    targetRevision: main
    path: k8s/gitops/mesh
    directory:
      include: "{policies.yaml,servicemonitors.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
