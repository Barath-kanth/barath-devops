apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: bookshelf-db
  namespace: bookshelf
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: bookshelf-db
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: aws-devops-dev/bookshelf-db
