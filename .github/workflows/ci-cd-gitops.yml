# CI → ECR → GitOps + static landing (S3/CloudFront)
# Vars: AWS_ROLE_TO_ASSUME, ECR_REGISTRY
# Optional vars: STATIC_BUCKET_NAME, CLOUDFRONT_DISTRIBUTION_ID (or discovered from Terraform outputs in a prior step)
# Local: export AWS_PROFILE=ohohub-project AWS_REGION=us-east-1

name: CI CD GitOps

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

env:
  AWS_REGION: us-east-1

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Syntax check backends
        run: |
          node --check apps/backend/catalog-api/src/server.js
          node --check apps/backend/catalog-api/src/app.js
          node --check apps/backend/catalog-api/src/db.js
          node --check apps/backend/loans-api/src/server.js
          node --check apps/backend/loans-api/src/app.js
          node --check apps/backend/loans-api/src/store.js

  build:
    name: ${{ matrix.name }}
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: catalog-api
            context: apps/backend/catalog-api
            ecr_repo: bookshelf/catalog-api
          - name: loans-api
            context: apps/backend/loans-api
            ecr_repo: bookshelf/loans-api
          - name: frontend
            context: apps/frontend
            ecr_repo: bookshelf/frontend
    steps:
      - uses: actions/checkout@v5

      - name: AWS OIDC
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: ECR login
        if: github.event_name != 'pull_request'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        env:
          REGISTRY: ${{ vars.ECR_REGISTRY }}
        run: |
          TAG="${GITHUB_SHA:0:7}"
          IMAGE="${REGISTRY}/${{ matrix.ecr_repo }}:${TAG}"

          docker build -t "$IMAGE" "${{ matrix.context }}"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "PR build only — skip push"
            exit 0
          fi

          docker push "$IMAGE"
          docker tag "$IMAGE" "${REGISTRY}/${{ matrix.ecr_repo }}:latest"
          docker push "${REGISTRY}/${{ matrix.ecr_repo }}:latest"

  gitops:
    name: Bump image tag
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Bump Helm image tag
        run: |
          TAG="${GITHUB_SHA:0:7}"
          FILE=k8s/helm/chart/bookshelf/values.yaml

          echo "tag: \"${TAG}\"" > k8s/helm/chart/bookshelf/image-tags.yaml
          sed -i "s|tag: \".*\"|tag: \"${TAG}\"|" "$FILE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/helm/chart/bookshelf/image-tags.yaml "$FILE"
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "chore(gitops): image tag ${TAG}"
          git push

  landing:
    name: Deploy static landing
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: AWS OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Sync landing → S3 + invalidate CloudFront
        env:
          BUCKET: ${{ vars.STATIC_BUCKET_NAME }}
          DIST_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          if [ -z "${BUCKET:-}" ]; then
            BUCKET="aws-devops-dev-static-927120871634"
            echo "Using default STATIC_BUCKET_NAME=$BUCKET (set repo var to override)"
          fi
          aws s3 sync apps/landing/ "s3://${BUCKET}/" \
            --delete \
            --cache-control "public,max-age=300" \
            --exclude "*.md"
          # HTML shorter cache for faster content updates
          aws s3 cp apps/landing/index.html "s3://${BUCKET}/index.html" \
            --cache-control "public,max-age=60" \
            --content-type "text/html"

          if [ -n "${DIST_ID:-}" ]; then
            aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
          else
            echo "CLOUDFRONT_DISTRIBUTION_ID unset — S3 synced; skip invalidation"
          fi
